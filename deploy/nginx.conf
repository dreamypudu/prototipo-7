# Config nginx para el contenedor frontend.
# - Sirve el SPA buildeado en /usr/share/nginx/html.
# - Reescribe rutas para el SPA (todas las rutas no-archivo van a index.html).
# - Hace reverse proxy de /api/* al backend (FastAPI en compass-backend:8000).
#
# Esta config asume que NO termina TLS aqui: si el servidor del edificio tiene
# un reverse proxy global (nginx, Caddy, traefik) con HTTPS, el contenedor del
# frontend solo escucha HTTP en el puerto 80. El proxy global se encarga del SSL.
#
# Si quisieras TLS dentro de este contenedor, agregar un segundo `server { listen 443 ssl; ... }`
# montando los certificados como volumen.

server {
    listen 80;
    server_name _;

    # Limite de body grande por si crece el payload de sesion.
    client_max_body_size 25M;

    # Compresion para activos estaticos.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_min_length 1024;

    # ----------------------
    # SPA: rutas del frontend
    # ----------------------
    root /usr/share/nginx/html;
    index index.html;

    # Cache largo para activos hasheados.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|ico|png|jpe?g|gif|webp|avif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ----------------------
    # API: reverse proxy al backend
    # ----------------------
    location /api/ {
        # Quita el prefijo /api antes de reenviar (backend espera /sessions, /health, etc.)
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts mas generosos para el endpoint que normaliza sesiones grandes.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ----------------------
    # SPA fallback
    # ----------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
