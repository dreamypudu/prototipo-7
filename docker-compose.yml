# Orquesta los contenedores de COMPASS para el despliegue en el servidor del edificio.
#
# Uso:
#   1) Copia .env.production.example a .env.production y completa los valores.
#   2) docker compose --env-file .env.production up -d --build
#   3) docker compose logs -f       # ver logs en vivo
#   4) docker compose down          # apagar
#
# Levanta frontend + backend + Postgres dentro del mismo proyecto Docker.
# La base persiste en el volumen nombrado `compass-db-data`.

services:
  db:
    image: postgres:16-alpine
    container_name: compass-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-compass}
    volumes:
      - compass-db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compass} -d ${POSTGRES_DB:-compass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compass-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: compass-backend:latest
    container_name: compass-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-compass}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-compass}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://compass.giia.udec.cl}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - compass-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: compass-frontend:latest
    container_name: compass-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - compass-net

volumes:
  compass-db-data:

networks:
  compass-net:
    driver: bridge
